<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Catalog</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="shirtsSection">
        <h1 class="sectionHeader">Shirts</h1>
        <div class="items">
            <div class="item">
                <img width="175" height="175" src="./assets/shirt/shirt.jpg" alt="green flannel shirt" />
                <h3>Green Flannel Shirt</h3>
            </div>
            <div class="item">
                <img width="175" height="175" src="./assets/shirt/shirt2.jpg" alt="blue athletic polo"/>
                <h3>Blue Athletic Polo</h3>
            </div>
            <div class="item">
                <img width="175" height="175" src="./assets/shirt/shirt3.jpg" alt="black long sleeve polo" />
                <h3>Black Long-Sleeve Polo</h3>
            </div>
        </div>
    </div>

    <div id="pantsSection">
        <h1 class="sectionHeader">Pants</h1>
        <div class="items">
            <div class="item">
                <img width="175" height="175" src="./assets/pants/Pants.jpg" alt="grey pants" />
                <h3>Grey Pants</h3>
            </div>
            <div class="item">
                <img width="175" height="175" src="./assets/pants/Pants2.jpg" alt="black pants"/>
                <h3>Black Pants</h3>
            </div>
            <div class="item">
                <img width="175" height="175" src="./assets/pants/Pants3.jpg" alt="green pants" />
                <h3>Green Pants</h3>
            </div>
        </div>
    </div>

    <div id="shoesSection">
        <h1 class="sectionHeader">Shoes</h1>
        <div class="items">
            <div class="item">
                <img width="175" height="175" src="./assets/shoes/AdidasShoe.jpg" alt="adidas shoes"/>
                <h3>Adidas Shoes</h3>
            </div>
            <div class="item">
                <img width="175" height="175" src="./assets/shoes/NewBalanceShoe.jpg" alt="new balance shoes" />
                <h3>New Balance Shoes</h3>
            </div>
            <div class="item">
                <img width="175" height="175" src="./assets/shoes/NikeShoe.jpg" alt="nike shoes"/>
                <h3>Nike Shoes</h3>
            </div>
        </div>
    </div>
</body>
</html>
